[project]
name = "notes-mcp-server"
version = "1.0.0"
description = "MCP server for the self-hosted Notes app — create, read, list, update and delete notes from any AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tlalos" }]
keywords = ["mcp", "notes", "agents", "llm", "model-context-protocol"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
notes-mcp-server = "notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_mcp"]
